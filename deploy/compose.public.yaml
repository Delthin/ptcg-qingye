# Run from repository root: docker compose -f deploy/compose.public.yaml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../ptcg-server/.env
    environment:
      NODE_ENV: production
      PTCG_BIND: 0.0.0.0
      PTCG_PORT: '8080'
      STORAGE_TYPE: sqlite
      STORAGE_DATABASE: /data/database.sq3
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - sqlite-data:/data
      - ../ptcg-server/scans:/app/ptcg-server/scans:ro
      - ../ptcg-server/avatars:/app/ptcg-server/avatars:ro
      - ../ptcg-server/sleeves:/app/ptcg-server/sleeves:ro
    stop_grace_period: 30s
volumes:
  sqlite-data:
